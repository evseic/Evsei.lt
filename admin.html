<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evsei | Admin Panel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300251b'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='18' fill='%2300ff66'>E</text></svg>"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --admin-bg: #000a07;
            --admin-card: #001f16;
            --admin-border: rgba(192,201,195,0.15);
        }
        body { background: var(--admin-bg); color: #fff; min-height: 100vh; font-family: 'Manrope', sans-serif; }
        .admin-container { max-width: 1000px; margin: 4rem auto; padding: 0 2rem; }
        .auth-card, .dashboard-card { background: var(--admin-card); border: 1px solid var(--admin-border); padding: 3rem; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .admin-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 2rem; color: var(--primary); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; text-transform: uppercase; color: #8fa398; letter-spacing: 0.1em; }
        input { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--admin-border); border-radius: 4px; color: #fff; font-family: inherit; }
        input:focus { outline: none; border-color: var(--primary); }
        .btn-admin { width: 100%; border: none; background: var(--primary); color: #000; padding: 1rem; font-weight: 700; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,255,102,0.2); }
        
        /* Dashboard Styles */
        .hidden { display: none !important; }
        .admin-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
        .logout-btn { color: #8fa398; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th { text-align: left; padding: 1rem; color: #8fa398; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--admin-border); }
        td { padding: 1.2rem 1rem; border-bottom: 1px solid var(--admin-border); vertical-align: top; font-size: 0.9rem; }
        .lead-name { font-weight: 700; color: #fff; }
        .lead-email { color: var(--primary); opacity: 0.8; }
        .lead-date { font-size: 0.8rem; color: #5d6e65; }
        .lead-details { line-height: 1.5; color: #c8d4cd; }
        
        .empty-state { text-align: center; padding: 4rem 0; color: #5d6e65; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Login Section -->
        <div id="authSection" class="auth-card">
            <h1 class="admin-title">Login.</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-admin">Enter Dashboard</button>
            </form>
            <p id="authError" style="color: #ff4d4d; font-size: 0.8rem; margin-top: 1rem;"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden">
            <div class="admin-nav">
                <h1 class="admin-title">Leads.</h1>
                <span id="logoutBtn" class="logout-btn">Sign Out</span>
            </div>
            
            <div class="dashboard-card">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 20%">Sender</th>
                            <th style="width: 15%">Phone</th>
                            <th>Project Details</th>
                            <th style="width: 15%">Date</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTable">
                        <!-- Leads injected here -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state hidden">No inquiries received yet.</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="admin.js"></script>
</body>
</html>
